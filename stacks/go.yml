# Stack rules: Go
detect: ["go.mod"]

files:
  - .golangci.yml

rules:
  - id: go-version-pinned
    check: "go.mod declares an explicit go directive"
  - id: go-vet
    check: "go vet ./... runs in CI"
  - id: go-test-race
    check: "go test -race ./... runs in CI"
  - id: golangci-lint
    check: "golangci-lint run in CI and fails the build"
    tool: golangci-lint
  - id: govulncheck
    check: "govulncheck ./... runs in CI"
    tool: govulncheck
    baseline: [OSPS-VM-05.03]

required_status_checks: ["build", "test", "lint", "vuln"]

scaffold:
  ask: [module_path]           # e.g. github.com/org/repo — rule-1 value
  files:
    - path: go.mod
      content: "module <module_path>; explicit go directive pinned to a released minor"
    - path: main.go
      content: "package main with an empty main() — just enough for go build ./... to succeed"
    - path: .golangci.yml
      content: "default linter set enabled; no disabled linters without a comment saying why"
  prove: "go build ./... && go vet ./..."
