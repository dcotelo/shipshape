# Stack rules: Bash / shell
detect: ["*.sh", "**/*.sh"]

rules:
  - id: strict-mode
    check: >-
      every executed script sets strict mode. The default is set -euo pipefail;
      a weaker mode (e.g. set -u for code targeting bash 3.2 semantics) passes
      only when the repo records it as a deliberate convention — in CONTRIBUTING
      or an equivalent contributor doc — with the reason. An undocumented weaker
      mode, or a script with no set line at all, fails. Sourced library files
      inherit the caller's mode and are exempt.
  - id: shellcheck
    check: "shellcheck runs in CI over all scripts"
    tool: shellcheck
  - id: no-curl-pipe-sh
    check: "no piping of remote content directly into a shell"

required_status_checks: ["shellcheck"]
