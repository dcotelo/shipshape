# Stack rules: TypeScript / Node / Next.js
detect: ["package.json", "tsconfig.json"]

files:
  - .nvmrc

rules:
  - id: lockfile-committed
    check: "package-lock.json / pnpm-lock.yaml / yarn.lock is in version control"
    baseline: [OSPS-QA-02.01]
  - id: typecheck
    check: "tsc --noEmit runs in CI"
  - id: lint-enforced
    check: "ESLint runs in CI and fails the build — installed is not configured"
  - id: format-enforced
    check: "Prettier check runs in CI"
  - id: node-version-pinned
    check: ".nvmrc exists and CI uses the same version"
  - id: dependency-audit
    check: "npm audit / pnpm audit runs in CI with a documented threshold"
    baseline: [OSPS-VM-05.01]

required_status_checks: ["build", "test", "typecheck", "lint"]

scaffold:
  ask: [package_name, publishable]   # npm scope/name; publish intent — rule-1 values
  files:
    - path: package.json
      content: >-
        name <package_name>; private: true unless <publishable>;
        scripts for build/test/lint/typecheck
    - path: tsconfig.json
      content: "strict: true; no implicit any; target/module pinned, not 'latest'"
    - path: .nvmrc
      content: "one released LTS major, matching the version CI uses"
    - path: src/index.ts
      content: "empty export {} — just enough for tsc --noEmit to succeed"
  prove: "npm install && npx tsc --noEmit"
  # lockfile-committed rule: commit the lockfile npm install produces.
